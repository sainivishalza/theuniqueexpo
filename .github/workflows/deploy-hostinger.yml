name: Deploy to Hostinger

# Manually triggered only — this never runs automatically on push,
# so a deploy always requires someone to click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "claude/remote-control-mwymfu"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy over SSH
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$SSH_HOST"

          echo "==> Locating the app directory on the server..."
          APP_DIR=$($SSH 'for f in $(find ~ -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" -not -path "*/.*/*" 2>/dev/null); do grep -q "\"name\": *\"expobridge\"" "$f" 2>/dev/null && dirname "$f" && break; done')
          if [ -z "$APP_DIR" ]; then
            echo "Could not find the expobridge app directory (package.json with name expobridge) on the server." >&2
            exit 1
          fi
          echo "App directory: $APP_DIR"

          echo "==> Running the deploy remotely..."
          $SSH "bash -s -- '$APP_DIR' '$DEPLOY_REF'" < scripts/hostinger-deploy-remote.sh
