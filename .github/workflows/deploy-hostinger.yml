name: Deploy to Hostinger

# Manually triggered only — this never runs automatically on push,
# so a deploy always requires someone to click "Run workflow".
#
# What it does: backs up the database and applies the SQL migrations on the
# Hostinger server (scripts/hostinger-deploy-remote.sh). It does NOT build or
# restart the website -- Hostinger builds and serves the site itself from the
# `main` branch (hPanel -> Websites -> theuniqueexpo.com -> Node.js).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install sshpass
        # This job only needs sshpass, from Ubuntu's own repos -- but the
        # runner image also has Google's Chrome apt repo pre-configured
        # (for unrelated browser-testing tooling), and `apt-get update`
        # fails the whole command if that repo's index is broken upstream,
        # even though apt still falls back to cached/older lists that are
        # perfectly fine for installing sshpass. Don't let a repo this job
        # never uses block every deploy.
        run: sudo apt-get update || true; sudo apt-get install -y sshpass

      - name: Deploy over SSH
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          # ServerAliveInterval/CountMax: keep the SSH session alive through
          # quiet stretches (the database dump and slow migrations print
          # nothing for a while) so an idle-connection timeout on the path
          # to Hostinger can't silently kill the deploy ("Broken pipe",
          # exit 255). A probe every 30s for up to 5 minutes of missed
          # responses rides that out without masking a dead connection.
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p $SSH_PORT $SSH_USER@$SSH_HOST"

          echo "==> Locating the app directory on the server..."
          APP_DIR=$($SSH 'for f in $(find ~ -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" -not -path "*/.*/*" 2>/dev/null); do grep -q "\"name\": *\"expobridge\"" "$f" 2>/dev/null && dirname "$f" && break; done')
          if [ -z "$APP_DIR" ]; then
            echo "Could not find the expobridge app directory (package.json with name expobridge) on the server." >&2
            exit 1
          fi
          echo "App directory: $APP_DIR"

          echo "==> Running the deploy remotely..."
          $SSH "bash -s -- '$APP_DIR' '$DEPLOY_REF'" < scripts/hostinger-deploy-remote.sh
